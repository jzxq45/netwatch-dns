name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
          - target: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
          - target: darwin-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build Windows
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $ldflagsGui = '-ldflags=-s -w -H=windowsgui'
          $ldflags = '-ldflags=-s -w'
          go build $ldflagsGui -o "$dist/netwatch.exe" ./cmd/netwatch
          go build $ldflags -o "$dist/monitor.exe" ./cmd/monitor
          Copy-Item "blocklist.txt" "$dist/blocklist.txt"
          '@echo off`r`nstart "" "%~dp0netwatch.exe"' | Set-Content "$dist/run.bat" -Encoding ASCII
          "Version: ${{ github.ref_name }}" | Set-Content "$dist/VERSION.txt" -Encoding UTF8
          Compress-Archive -Path "$dist/*" -DestinationPath "netwatch-${{ matrix.target }}.zip"

      - name: Build Unix
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/netwatch ./cmd/monitor
          cp blocklist.txt dist/
          echo "Version: ${{ github.ref_name }}" > dist/VERSION.txt
          tar -czvf "netwatch-${{ matrix.target }}.tar.gz" -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netwatch-${{ matrix.target }}
          path: |
            *.zip
            *.tar.gz

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  release:
    name: Publish GitHub Release
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

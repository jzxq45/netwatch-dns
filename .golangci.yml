version: "2"

linters:
  # Explicit opt-in set (was: --disable-all -E govet,errcheck,ineffassign,gofmt).
  # Note: govet here runs the default checker set; heavy sub-analyzers like
  # fieldalignment are NOT enabled by default, so nothing extra to mute.
  default: none
  enable:
    - govet
    - errcheck
    - ineffassign

# In golangci-lint v2 gofmt is a formatter and lives in its own section
# (no `default` key here — the schema only allows it under `linters`).
formatters:
  enable:
    - gofmt
